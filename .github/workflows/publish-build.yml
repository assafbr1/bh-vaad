# פרסום אוטומטי של בניית נתוני האתר (דאשבורד ועד בית חורון)
# הריצות המתוזמנות דוחפות לענף build-* את keys.json ואת data.enc.txt, או את חלקיו
# data.enc.part-NN.txt (פרוסות של 30,000 תווים, כי הקובץ המלא גדול מדי לקריאה אחת של push_files),
# ומגרסה 1.8 גם את guestkeys.json ואת guests/<id>.enc.txt (חבילה מוצפנת לכל משתתף חיצוני).
# הפעולה מאחה את החלקים ל-data.enc.txt, מעתיקה רק את קובצי הנתונים ל-main
# (אף פעם לא index.html, worker.html או קובץ אחר), מוחקת מ-main קובצי משתתפים שאינם מופיעים עוד
# ב-guestkeys.json (משתתף שהושבת או הוסר), סוגרת PR אם נפתח ומוחקת את הענף.
name: publish-build
on:
  push:
    branches: ['build-**']
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: publish-build
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: איחוי החלקים והעתקת קובצי הנתונים בלבד ל-main
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -e
          git fetch origin "$BRANCH"
          changed=$(git diff --name-only main "origin/$BRANCH")
          echo "changed files: $changed"
          for f in $changed; do
            case "$f" in
              data.enc.txt|keys.json|data.enc.part-[0-9][0-9].txt|guestkeys.json|guests/*.enc.txt) ;;
              *) echo "הענף משנה קובץ שאינו קובץ נתונים ($f); לא מפורסם אוטומטית"; exit 1 ;;
            esac
          done
          if [ -z "$changed" ]; then echo "אין שינוי"; exit 0; fi
          git checkout "origin/$BRANCH" -- keys.json
          parts=$(git ls-tree --name-only "origin/$BRANCH" | grep -E '^data\.enc\.part-[0-9]{2}\.txt$' | sort || true)
          if [ -n "$parts" ]; then
            echo "concatenating parts: $parts"
            : > data.enc.txt
            for p in $parts; do git show "origin/$BRANCH:$p" >> data.enc.txt; done
          else
            git checkout "origin/$BRANCH" -- data.enc.txt
          fi
          echo "data.enc.txt blob sha: $(git hash-object data.enc.txt), $(wc -c < data.enc.txt) bytes"
          # קובצי המשתתפים (גרסה 1.8): guestkeys.json קובע אילו קבצים חיים; השאר נמחקים מ-main
          if git cat-file -e "origin/$BRANCH:guestkeys.json" 2>/dev/null; then
            git checkout "origin/$BRANCH" -- guestkeys.json
            live=$(python3 -c "import json;d=json.load(open('guestkeys.json'));print('\n'.join(sorted(e.get('f','') for e in d.get('entries',{}).values() if e.get('f'))))")
            mkdir -p guests
            for f in guests/*.enc.txt; do
              [ -e "$f" ] || continue
              echo "$live" | grep -qx "$f" || { echo "removing stale $f"; git rm -q --ignore-unmatch "$f"; rm -f "$f"; }
            done
            for f in $live; do
              case "$f" in guests/*.enc.txt) git checkout "origin/$BRANCH" -- "$f" ;; *) echo "guestkeys.json מפנה לקובץ לא צפוי ($f)"; exit 1 ;; esac
            done
            echo "guest files: $(echo "$live" | grep -c . || true)"
          fi
          git config user.name "bh-vaad publish"
          git config user.email "noreply@github.com"
          git add -A -- data.enc.txt keys.json
          if [ -e guestkeys.json ]; then git add -A -- guestkeys.json; git add -A -- guests 2>/dev/null || true; fi
          if git diff --cached --quiet; then echo "אין שינוי מול main"; exit 0; fi
          git commit -m "פרסום בנייה מ-$BRANCH"
          git push origin HEAD:main
      - name: סגירת PR (אם נפתח) ומחיקת הענף
        env:
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number'); do
            gh pr close "$n" --comment "פורסם אוטומטית ל-main" || true
          done
          git push origin --delete "$BRANCH" || true
