<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#24533A">
<title>ועד בית חורון · המשימות שלי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* אתר המשתתפים (גרסה 1.8): עובדים, יועצים וקבלנים רואים כאן רק את המשימות ששויכו להם, את ההנחיה ואת העדכונים שסומנו גלויים, ומדווחים. */
:root{
  --bg:#EEF3F0; --surface:#FFFFFF; --surface2:#F5F8F6; --ink:#17231C; --muted:#5B6B62; --line:#DCE5DF;
  --brand:#24533A; --brand2:#1D6A7A; --brand-ink:#FFFFFF; --brand-soft:#DDEBE2;
  --open:#2463A6; --open-soft:#E2EDFA; --prog:#0E7A6B; --prog-soft:#D9F2ED; --wait:#B06200; --wait-soft:#FDEBD3;
  --done:#2E7D32; --done-soft:#E1F3E2; --bad:#C0352B; --bad-soft:#FBE2DF; --pend:#6B4FA0; --pend-soft:#ECE5F7;
  --shadow:0 1px 2px rgba(23,35,28,.06),0 6px 18px rgba(23,35,28,.07); color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101714; --surface:#18221D; --surface2:#1E2A24; --ink:#E7EEE9; --muted:#9FB0A6; --line:#2B3A32;
  --brand:#2E6B4A; --brand2:#23707F; --brand-ink:#FFFFFF; --brand-soft:#223A2D;
  --open:#8BB8EE; --open-soft:#1B2C40; --prog:#6FD4C2; --prog-soft:#153530; --wait:#F2B461; --wait-soft:#3A2B15;
  --done:#86D18A; --done-soft:#1C3320; --bad:#F28B80; --bad-soft:#3D1F1C; --pend:#C7AEF2; --pend-soft:#2D2440; --shadow:none; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#101714; --surface:#18221D; --surface2:#1E2A24; --ink:#E7EEE9; --muted:#9FB0A6; --line:#2B3A32;
  --brand:#2E6B4A; --brand2:#23707F; --brand-ink:#FFFFFF; --brand-soft:#223A2D;
  --open:#8BB8EE; --open-soft:#1B2C40; --prog:#6FD4C2; --prog-soft:#153530; --wait:#F2B461; --wait-soft:#3A2B15;
  --done:#86D18A; --done-soft:#1C3320; --bad:#F28B80; --bad-soft:#3D1F1C; --pend:#C7AEF2; --pend-soft:#2D2440; --shadow:none; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "Heebo","Arial Hebrew",Arial,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3{margin:0;text-wrap:balance}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--open);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:linear-gradient(160deg,var(--brand) 0%,var(--brand2) 100%)}
.login-card{background:var(--surface);border-radius:18px;padding:30px 24px;width:100%;max-width:420px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.login-card .logo{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;margin-bottom:14px}
.login-card h1{font-size:26px;font-weight:800;color:var(--brand)}
.login-card .sub{color:var(--muted);margin:4px 0 22px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-weight:700;font-size:15px}
.code-in{direction:ltr;text-align:center;letter-spacing:.16em;font-family:ui-monospace,Consolas,monospace;font-size:21px;padding:14px;border:2px solid var(--line);border-radius:12px;background:var(--surface2);text-transform:uppercase;width:100%}
.code-in:focus{border-color:var(--brand2);outline:none}
.chk{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--muted);margin-bottom:18px}
.chk input{width:20px;height:20px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:700;min-height:44px}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.block{width:100%;font-size:17px}
.btn:disabled{opacity:.6;cursor:wait}
.err{color:var(--bad);font-size:15px;min-height:22px;margin-top:10px;font-weight:500}
.notice{font-size:13px;color:var(--muted);border-top:1px dashed var(--line);margin-top:18px;padding-top:12px}
.hero{background:linear-gradient(120deg,var(--brand) 0%,var(--brand2) 100%);color:var(--brand-ink);padding-top:env(safe-area-inset-top,0px)}
.hero .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding-block:18px 26px}
.hero h1{font-size:23px;font-weight:800}
.hero .meta{font-size:14px;opacity:.9;display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:2px}
.logout{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:10px;padding:8px 14px;font-weight:700;min-height:40px}
.main{padding-top:18px}
.intro{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:12px 16px;margin-bottom:16px;font-size:15px;color:var(--muted)}
.intro b{color:var(--ink)}
.sec-h{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:800;margin:18px 0 10px}
.sec-h small{color:var(--muted);font-size:14px;font-weight:500}
.sec-h::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
.task{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;border-inline-start:6px solid var(--sc)}
.task.st-open{--sc:var(--open);--ss:var(--open-soft)} .task.st-progress{--sc:var(--prog);--ss:var(--prog-soft)}
.task.st-waiting{--sc:var(--wait);--ss:var(--wait-soft)} .task.st-done{--sc:var(--done);--ss:var(--done-soft)}
.task.overdue{--sc:var(--bad)}
.task-head{width:100%;text-align:right;background:none;border:none;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.task-top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;width:100%}
.task-title{font-weight:700;font-size:17px;line-height:1.4}
.chev{flex:none;width:22px;height:22px;color:var(--muted);transition:transform .2s;margin-top:2px}
.task-head[aria-expanded="true"] .chev{transform:rotate(180deg)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;white-space:nowrap;background:var(--surface2);color:var(--muted)}
.tag svg{width:14px;height:14px}
.tag.status{background:var(--ss);color:var(--sc)}
.tag.late{background:var(--bad-soft);color:var(--bad)} .tag.soon{background:var(--wait-soft);color:var(--wait)}
.tag.pend{background:var(--pend-soft);color:var(--pend)}
.ins{font-size:15.5px;color:var(--ink);background:var(--brand-soft);border-radius:10px;padding:8px 12px;text-align:right;width:100%}
.ins b{color:var(--brand)}
:root:not([data-theme="light"]) .ins b{color:var(--ink)}
.task-body{padding:0 16px 16px;font-size:15.5px}
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl li{position:relative;padding:0 18px 12px 0;font-size:15px}
.tl li::before{content:"";position:absolute;right:3px;top:8px;width:9px;height:9px;border-radius:50%;background:var(--sc)}
.tl li::after{content:"";position:absolute;right:7px;top:18px;bottom:-2px;width:1px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl li.mine::before{background:var(--pend)}
.tl time{display:block;color:var(--muted);font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
.empty-upd{color:var(--muted);margin:0 0 8px}
.rep-open{margin-top:12px;width:100%;background:var(--brand);color:var(--brand-ink);border:none}
.rep{margin-top:12px;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.rep label.l{font-size:14px;font-weight:700;color:var(--muted);display:block;margin-bottom:4px}
.rep textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;width:100%;min-height:96px;resize:vertical;font-size:16px}
.done-chk{display:flex;gap:10px;align-items:flex-start;font-size:15px;font-weight:700;background:var(--done-soft);color:var(--done);border-radius:10px;padding:10px 12px}
.done-chk input{width:20px;height:20px;flex:none;margin-top:2px}
.rep .hint{font-size:13px;color:var(--muted);margin:0}
.rep .row2{display:flex;gap:8px}
.rep .row2 .btn{flex:1}
.rep-msg{font-size:15px;color:var(--done);font-weight:700;margin-top:10px;background:var(--done-soft);border-radius:10px;padding:8px 12px}
.rep-msg.err{color:var(--bad);background:var(--bad-soft)}
.contact{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:12px 16px;margin:18px 0;font-size:15px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.contact a{color:var(--open);font-weight:700}
.empty{color:var(--muted);text-align:center;padding:36px 16px;background:var(--surface);border-radius:16px}
footer{color:var(--muted);font-size:13px;margin:30px 0 20px;text-align:center}
.task.flash{outline:3px solid var(--brand);outline-offset:2px;scroll-margin-top:16px}
@media (max-width:720px){ .hero h1{font-size:20px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="login" class="login">
  <form class="login-card" id="login-form" autocomplete="off">
    <div class="logo" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg></div>
    <h1>ועד בית חורון</h1>
    <div class="sub">המשימות שלי מטעם הוועד</div>
    <div class="field">
      <label for="code">קוד כניסה אישי</label>
      <input id="code" class="code-in" inputmode="text" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX" required>
    </div>
    <label class="chk"><input type="checkbox" id="remember"> לזכור את הקוד במכשיר זה</label>
    <button class="btn primary block" id="go" type="submit">כניסה</button>
    <div class="err" id="err" role="alert"></div>
    <div class="notice">הקוד אישי ואין להעבירו לאחר. כל כניסה נרשמת ביומן של הוועד (שם ושעה). רואים כאן רק את המשימות שהוועד שייך לך.</div>
  </form>
</div>

<div id="app" hidden>
  <header class="hero">
    <div class="wrap">
      <div>
        <h1>ועד בית חורון · המשימות שלי</h1>
        <div class="meta"><span id="hello"></span><span id="updated"></span></div>
      </div>
      <button class="logout" id="logout" type="button">יציאה</button>
    </div>
  </header>
  <div class="wrap main">
    <div class="intro" id="intro"></div>
    <div id="open-sec"></div>
    <div id="done-sec"></div>
    <div id="contact"></div>
    <footer>הנתונים מתעדכנים פעמיים ביום. דיווח שנשלח מופיע כאן ולוועד בעדכון הבא. סגירת משימה נעשית בידי הוועד.</footer>
  </div>
</div>

<script>
(function(){
const STATUS = {open:'פתוחה', progress:'בטיפול', waiting:'ממתינה', done:'הושלמה'};
const ICON = {
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>',
  chev:'<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l4 4 10-10"/></svg>'
};
const enc = new TextEncoder(), dec = new TextDecoder();
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = (c) => String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const ub64 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const hex = (buf) => Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
const todayISO = () => new Date(Date.now() + 3*3600e3).toISOString().slice(0,10);
const fmtD = (iso) => { if(!iso) return ''; const [y,m,d] = String(iso).slice(0,10).split('-'); return +d + '.' + +m + '.' + y; };
const canon = (s) => String(s||'').replace(/[^\p{L}\p{N}]/gu, '');
const DONE_TOK = 'סיימתי: ';
let DATA = null, ME = null, CODE = '';
const st = { open: {} };

async function lookupId(code){ return hex(await crypto.subtle.digest('SHA-256', enc.encode('bhv1:'+norm(code)))).slice(0,24); }
async function fetchText(p){ const r = await fetch(p + '?t=' + Date.now(), {cache:'no-store'}); if(!r.ok) throw new Error('http'); return r.text(); }
// הפענוח: guestkeys.json ממפה את הקוד (דרך lookupId) לקובץ המוצפן האישי; המפתח עטוף בקוד של המשתתף בלבד
async function unlock(code){
  const keys = JSON.parse(await fetchText('guestkeys.json'));
  const e = keys.entries[await lookupId(code)];
  if(!e || !e.f || !/^guests\/[A-Za-z0-9_.-]+\.enc\.txt$/.test(e.f)) throw new Error('bad-code');
  const base = await crypto.subtle.importKey('raw', enc.encode(norm(code)), 'PBKDF2', false, ['deriveKey']);
  const kek = await crypto.subtle.deriveKey({name:'PBKDF2', salt:ub64(e.s), iterations:keys.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const inner = JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:ub64(e.i)}, kek, ub64(e.c))));
  const dk = await crypto.subtle.importKey('raw', ub64(inner.k), 'AES-GCM', false, ['decrypt']);
  const blob = ub64((await fetchText(e.f)).trim());
  const gz = await crypto.subtle.decrypt({name:'AES-GCM', iv:blob.slice(0,12)}, dk, blob.slice(12));
  const plain = await new Response(new Response(gz).body.pipeThrough(new DecompressionStream('gzip'))).text();
  return { me:{id:inner.id, name:inner.n}, data: JSON.parse(plain) };
}
async function post(obj){
  if(!DATA.logUrl) return false;
  try { await fetch(DATA.logUrl, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'}, body: JSON.stringify(obj)}); return true; } catch(e){ return false; }
}
function logVisit(){ post({id:ME.id, n:ME.name, t:new Date().toISOString(), kind:'guest', ua:navigator.userAgent.slice(0,120)}); }
function sentList(){ try { return JSON.parse(localStorage.getItem('bhw-sent-'+ME.id) || '[]'); } catch(e){ return []; } }
function saveSent(arr){ try { localStorage.setItem('bhw-sent-'+ME.id, JSON.stringify(arr)); } catch(e){} }
function pendingFor(taskId){ const gen = DATA.generatedAt || ''; return sentList().filter(s => s.task === taskId && s.t > gen); }
function pruneSent(){ const gen = DATA.generatedAt || ''; saveSent(sentList().filter(s => s.t > gen)); }
// דיווח: אותו ערוץ ואותה חתימה (bhv-rep2) כמו באתר הוועד, עם הקוד של המשתתף; בלי שינוי סטטוס ובלי בקשת סגירה
async function sendReport(t, text){
  const ts = new Date().toISOString(), status = t.status || 'open';
  const sig = hex(await crypto.subtle.digest('SHA-256', enc.encode(['bhv-rep2', CODE, ME.id, t.id, canon(ts), status, 0, canon(text)].join('|'))));
  const ok = await post({type:'progress', v:1, kind:'guest', id:ME.id, n:ME.name, task:t.id, title:t.title, text, status, close:false, t:ts, sig});
  if(ok){ const arr = sentList(); arr.push({task:t.id, text, t:ts}); saveSent(arr); }
  return ok;
}

$('login-form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const code = $('code').value; $('err').textContent = ''; $('go').disabled = true; $('go').textContent = 'פותח…';
  try {
    const r = await unlock(code); DATA = r.data; ME = r.me; CODE = norm(code);
    try { if($('remember').checked) localStorage.setItem('bhw-code', CODE); else localStorage.removeItem('bhw-code'); } catch(e){}
    logVisit(); start();
  } catch(e){
    $('err').textContent = e.message === 'bad-code' ? 'הקוד שהוזן אינו מוכר. בדוק שהקלדת אותו כפי שקיבלת.' : 'לא ניתן לפתוח את הנתונים כרגע. נסה שוב בעוד דקה.';
  } finally { $('go').disabled = false; $('go').textContent = 'כניסה'; }
});
$('logout').addEventListener('click', () => { try { localStorage.removeItem('bhw-code'); } catch(e){} location.reload(); });

const isOverdue = (t) => t.status !== 'done' && t.due && t.due < todayISO();
const soon = (t) => { if(t.status==='done'||!t.due) return false; const d=(new Date(t.due)-new Date(todayISO()))/864e5; return d>=0 && d<=7; };
function start(){
  $('login').hidden = true; $('app').hidden = false;
  const me = DATA.me || ME;
  $('hello').textContent = 'שלום, ' + (me.name || ME.name) + (me.role ? ' · ' + me.role : '');
  $('updated').textContent = 'עודכן ' + new Date(DATA.generatedAt).toLocaleString('he-IL', {dateStyle:'short', timeStyle:'short', timeZone:'Asia/Jerusalem'});
  pruneSent(); render(); openFromHash(); window.addEventListener('hashchange', openFromHash);
}
function openFromHash(){
  let id = ''; try { const m = location.hash.match(/task=([^&]+)/); id = m ? decodeURIComponent(m[1]) : ''; } catch(e){}
  if(!id || !DATA.tasks.some(t => t.id === id)) return; st.open[id] = true; render();
  const head = document.querySelector('.task-head[data-id="'+CSS.escape(id)+'"]'); if(!head) return;
  const art = head.closest('.task'); art.classList.add('flash'); art.scrollIntoView({ block: 'start' }); setTimeout(() => art.classList.remove('flash'), 5000);
}
function render(){
  const tasks = DATA.tasks || [], open = tasks.filter(t => t.status !== 'done'), done = tasks.filter(t => t.status === 'done');
  const byDue = (a,b) => (isOverdue(b)-isOverdue(a)) || (a.due||'9').localeCompare(b.due||'9');
  $('intro').innerHTML = open.length ? '<b>'+open.length+' משימות פתוחות</b> שהוועד שייך לך. בכל משימה מופיעה ההנחיה; כשיש התקדמות, לחץ "דיווח" וכתוב בקצרה. הדיווח מגיע לוועד.' : 'אין כרגע משימות פתוחות ששויכו לך.';
  $('open-sec').innerHTML = open.length ? '<h2 class="sec-h">משימות פתוחות <small>'+open.length+'</small></h2><div class="grid">'+open.sort(byDue).map(taskHtml).join('')+'</div>' : '';
  $('done-sec').innerHTML = done.length ? '<h2 class="sec-h">הושלמו <small>'+done.length+'</small></h2><div class="grid">'+done.sort((a,b) => String(b.doneAt||'').localeCompare(String(a.doneAt||''))).map(taskHtml).join('')+'</div>' : '';
  const c = (DATA.contact||{}).limor;
  $('contact').innerHTML = c && c.name ? '<div class="contact"><span>שאלות על המשימות: <b>'+esc(c.name)+'</b>, מנכ"לית היישוב'+(c.phone ? ' · <a href="https://wa.me/'+esc(c.phone)+'" target="_blank" rel="noopener">וואטסאפ</a> · <a href="tel:+'+esc(c.phone)+'">טלפון</a>' : '')+'</span></div>' : '';
  document.querySelectorAll('.task-head').forEach(b => b.onclick = () => { const id = b.dataset.id; st.open[id] = !st.open[id]; render(); });
  document.querySelectorAll('[data-rep]').forEach(b => b.onclick = () => openForm(b.dataset.rep));
}
function taskHtml(t){
  const done = t.status === 'done', late = isOverdue(t), mine = pendingFor(t.id), expanded = !!st.open[t.id];
  const tags = ['<span class="tag status">'+(done?ICON.check:'')+esc(STATUS[t.status]||t.status)+'</span>'];
  if(done && t.doneAt) tags.push('<span class="tag">'+ICON.cal+'הושלמה '+fmtD(t.doneAt)+'</span>');
  else if(t.due) tags.push('<span class="tag '+(late?'late':soon(t)?'soon':'')+'">'+ICON.cal+(late?'באיחור · ':'עד ')+fmtD(t.due)+'</span>');
  if(mine.length) tags.push('<span class="tag pend">דיווח נשלח, יופיע בעדכון הבא</span>');
  const ups = (t.updates||[]).slice().reverse();
  const pend = mine.slice().reverse().map(s => '<li class="mine"><time>'+fmtD(s.t)+' · נשלח, יופיע בעדכון הבא</time>'+esc(s.text)+'</li>').join('');
  const upd = ups.map(u => '<li'+(u.mine?' class="mine"':'')+'><time>'+fmtD(u.at)+(u.by ? ' · ' + esc(u.mine ? 'אני' : u.by) : ' · הוועד')+'</time>'+esc(u.text)+'</li>').join('');
  return '<article class="task st-'+esc(t.status)+(late?' overdue':'')+'"><button class="task-head" data-id="'+esc(t.id)+'" aria-expanded="'+expanded+'">'+
    '<span class="task-top"><span class="task-title">'+esc(t.title)+'</span>'+ICON.chev+'</span><span class="tags">'+tags.join('')+'</span>'+
    '<span class="ins"><b>ההנחיה:</b> '+(t.instruction ? esc(t.instruction) : '<span style="color:var(--muted)">טרם נכתבה הנחיה; פנה למנכ"לית</span>')+'</span></button>'+
    '<div class="task-body"'+(expanded?'':' hidden')+'>'+((pend||upd) ? '<ul class="tl">'+pend+upd+'</ul>' : '<p class="empty-upd">אין עדכונים עדיין.</p>')+
    (!done ? '<div id="rep-'+esc(t.id)+'"><button class="btn rep-open" data-rep="'+esc(t.id)+'">דיווח</button></div>' : '')+'</div></article>';
}
function openForm(id){
  const t = DATA.tasks.find(x => x.id === id); if(!t) return; const box = $('rep-'+id); if(!box) return;
  const fid = 'r-' + id.replace(/[^a-zA-Z0-9_-]/g,'');
  box.innerHTML = '<form class="rep" id="'+fid+'-form"><div><label class="l" for="'+fid+'-text">מה נעשה?</label><textarea id="'+fid+'-text" placeholder="למשל: הוחלפו שתי נורות, השלישית דורשת חשמלאי."></textarea></div>'+
    '<label class="done-chk"><input type="checkbox" id="'+fid+'-done"> <span>סיימתי את המשימה</span></label>'+
    '<p class="hint">הדיווח מגיע לוועד ומופיע כאן בעדכון הבא של האתר. סגירת המשימה נעשית בידי הוועד.</p>'+
    '<div class="row2"><button type="button" class="btn" id="'+fid+'-cancel">ביטול</button><button type="submit" class="btn primary" id="'+fid+'-send">שליחה</button></div></form>';
  $(fid+'-text').focus();
  $(fid+'-cancel').onclick = () => render();
  $(fid+'-form').onsubmit = async (ev) => { ev.preventDefault();
    let text = $(fid+'-text').value.replace(/\s+/g,' ').trim(); const fin = $(fid+'-done').checked;
    if(!text && !fin){ $(fid+'-text').focus(); return; }
    if(fin) text = DONE_TOK + (text || 'המשימה הושלמה');
    $(fid+'-send').disabled = true; $(fid+'-send').textContent = 'שולח…';
    const ok = await sendReport(t, text.slice(0, 2000));
    st.open[id] = true; render();
    const b = $('rep-'+id); if(b) b.insertAdjacentHTML('afterbegin', ok ? '<div class="rep-msg" role="status">הדיווח נשלח לוועד. תודה!</div>' : '<div class="rep-msg err" role="alert">השליחה נכשלה. בדוק את החיבור ונסה שוב.</div>');
  };
}
try { const saved = localStorage.getItem('bhw-code'); if(saved){ $('code').value = saved; $('remember').checked = true; $('login-form').requestSubmit(); } } catch(e){}
})();
</script>
